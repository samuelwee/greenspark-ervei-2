<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b2b"/>
      <stop offset="1" stop-color="#ffa63d"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3fc4"/>
      <stop offset="1" stop-color="#7fd0ff"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sun)"/>
    <!-- the shade: the dome swept along the light, which falls from the top left -->
    <path d="M10 31 A22 22 0 0 1 51.700 21.200 L96.400 110.600 L54.700 120.400 Z" fill="url(#shade)"/>
  </g>
  <!-- umbrella -->
  <path d="M10 31 A22 22 0 0 1 54 31 Z" fill="#fff"/>
  <path d="M32 31 V50 A4.500 4.500 0 0 1 23 50" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
